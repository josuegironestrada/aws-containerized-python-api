
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: cloud-portfolio-api:v2

    ports:
      - "127.0.0.1:8001:8000"

    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - backend

  redis:
    image: redis:7-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  redis_data:
